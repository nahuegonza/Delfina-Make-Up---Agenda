# Web pública de Delfina Acuña Makeup. En Netlify, "Base directory" = web
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Runtime de Next.js para Netlify (convierte la página, el ISR y /api/consulta en funciones).
[[plugins]]
  package = "@netlify/plugin-nextjs"
